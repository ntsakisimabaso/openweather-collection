info:
  name: 05-delete-station
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/stations/{{stationId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
