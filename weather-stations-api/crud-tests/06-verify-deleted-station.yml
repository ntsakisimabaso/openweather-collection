info:
  name: 06-verify-deleted-station
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/stations/{{stationId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.code
      operator: eq
      value: "404001"
    - expression: res.body.message
      operator: eq
      value: Station not found

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
