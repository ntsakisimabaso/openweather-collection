info:
  name: 06-invalid-station-id
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/stations/1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.message
      operator: eq
      value: Station id not valid

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
