info:
  name: 02-missing-required-field
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/stations"
  body:
    type: json
    data: |-
      {
        "external_id": "{{external-id}}",
        "latitude": {{latitude}},
        "longitude": {{longitude}},
        "altitude": {{altitude}}
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.message
      operator: eq
      value: Bad or zero length station name

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
