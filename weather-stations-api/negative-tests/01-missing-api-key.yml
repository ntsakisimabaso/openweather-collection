info:
  name: 01-missing-api-key
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/stations/{{stationId}}"
  auth:
    type: apikey
    key: appid
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
