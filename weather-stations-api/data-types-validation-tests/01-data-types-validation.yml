info:
  name: 01-data-types-validation
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/stations"
  body:
    type: json
    data: |-
      {
        "external_id": "{{external-id}}",
        "name": "{{station-name}}",
        "latitude": {{latitude}},
        "longitude": {{longitude}},
        "altitude": {{altitude}}
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.body.name
      operator: isString
    - expression: res.body.latitude
      operator: isNumber
    - expression: res.body.longitude
      operator: isNumber
    - expression: res.body.altitude
      operator: isNumber
    - expression: res.body.external_id
      operator: isString
    - expression: res.body.ID
      operator: isString
    - expression: res.body.user_id
      operator: isString
    - expression: res.body.rank
      operator: isNumber
    - expression: res.body.source_type
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
