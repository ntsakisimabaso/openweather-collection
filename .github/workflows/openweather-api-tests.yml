name: OpenWeather API Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bruno
        run: npm install -g @usebruno/cli

      - name: Run API tests
        run: |
          bru run ./OpenWeather \
            --env qa
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
