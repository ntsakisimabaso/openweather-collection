opencollection: 1.0.0

info:
  name: openweather-collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: apikey
    key: appid
    value: "{{api-key}}"
    placement: query
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
